<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d">
<title id="t">How Sign in with GitHub and storage work</title>
<desc id="d">The browser sends the person to GitHub to sign in and gets a code back. It passes the code to a relay, which adds the client secret and returns a token. The browser then reads and writes files in the person's own repo through the GitHub API.</desc>
<style>
  :root { --bg:#fffcf0; --fg:#100f0f; --mut:#6f6e69; --line:#b7b5ac; --box:#f2f0e5; --in:#fffcf0; --a:#205ea6; --o:#bc5215; --g:#66800b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#100f0f; --fg:#cecdc3; --mut:#878580; --line:#575653; --box:#1c1b1a; --in:#100f0f; --a:#4385be; --o:#da702c; --g:#879a39; } }
  text { font: 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: var(--fg); }
  .m { fill: var(--mut); font-size: 12.5px; }
  .h { font-weight: 600; font-size: 17px; }
  .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
  .ic { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ar { stroke-width: 2.2; fill: none; }
  .lb { font-size: 13px; font-weight: 600; }
  .n { font-weight: 700; font-size: 12px; fill: #fff; text-anchor: middle; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
</defs>
<rect width="900" height="480" fill="var(--bg)"/>

<!-- browser -->
<rect class="box" x="20" y="20" width="290" height="440" rx="14"/>
<g class="ic" stroke="var(--fg)" transform="translate(40 40) scale(1.6)"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M2 9h20M5.5 6.5h.01M8.5 6.5h.01"/></g>
<text class="h" x="92" y="64">Your site</text>
<text class="m" x="92" y="84">static page in the browser</text>
<rect x="40" y="116" width="250" height="150" rx="10" fill="var(--in)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="56" y="134" width="218" height="38" rx="7" fill="none" stroke="var(--line)" stroke-width="1.5"/>
<text x="68" y="158">hello, world</text>
<rect x="56" y="186" width="96" height="34" rx="17" fill="var(--g)"/><text x="104" y="208" text-anchor="middle" style="fill:#fff;font-weight:600">Save</text>
<text class="m" x="56" y="248">any data your app keeps</text>
<text class="h" x="40" y="312" style="font-size:15px">client/ghstore.js</text>
<text class="m" x="40" y="334">PKCE, token, read, write, list</text>
<g class="ic" stroke="var(--mut)" transform="translate(40 358) scale(1.1)"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
<text class="m" x="72" y="376">The token stays in this browser.</text>
<text class="m" x="72" y="396">No server of your own, no secret.</text>

<!-- github -->
<rect class="box" x="580" y="20" width="300" height="130" rx="14"/>
<g class="ic" stroke="var(--a)" transform="translate(600 40) scale(1.6)"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>
<text class="h" x="652" y="64">github.com</text>
<text class="m" x="652" y="84">the person signs in</text>
<text class="m" x="600" y="116">and picks which repos</text>
<text class="m" x="600" y="134">the app may use</text>

<!-- relay -->
<rect class="box" x="580" y="170" width="300" height="130" rx="14"/>
<g class="ic" stroke="var(--o)" transform="translate(600 190) scale(1.6)"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></g>
<text class="h" x="652" y="214">Relay</text>
<text class="m" x="652" y="234">one Cloudflare Worker</text>
<text class="m" x="600" y="266">adds the client secret, asks GitHub,</text>
<text class="m" x="600" y="284">keeps nothing</text>

<!-- repo -->
<rect class="box" x="580" y="320" width="300" height="140" rx="14"/>
<g class="ic" stroke="var(--g)" transform="translate(600 340) scale(1.6)"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g>
<text class="h" x="652" y="364">The person's own repo</text>
<text class="m" x="652" y="384">through api.github.com</text>
<text class="m" x="600" y="416">my-app/data.json   other-app/notes.md</text>
<text class="m" x="600" y="436">history and AI-agent editing come free</text>

<!-- 1, 2 -->
<path class="ar" d="M310 62H580" stroke="var(--a)" marker-end="url(#ah)"/>
<text class="lb" x="445" y="52" text-anchor="middle" style="fill:var(--a)">sign in, PKCE</text>
<path class="ar" d="M580 112H310" stroke="var(--a)" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<text class="lb" x="445" y="132" text-anchor="middle" style="fill:var(--a)">one-time code</text>
<!-- 3 -->
<path class="ar" d="M310 212H580" stroke="var(--o)" marker-end="url(#ah)"/>
<text class="lb" x="445" y="202" text-anchor="middle" style="fill:var(--o)">code + verifier</text>
<path class="ar" d="M580 262H310" stroke="var(--o)" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<text class="lb" x="445" y="282" text-anchor="middle" style="fill:var(--o)">access token</text>
<!-- 4 -->
<path class="ar" d="M310 390H580" stroke="var(--g)" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text class="lb" x="445" y="380" text-anchor="middle" style="fill:var(--g)">read, write files</text>

<circle cx="340" cy="62" r="11" fill="var(--a)"/><text class="n" x="340" y="66">1</text>
<circle cx="340" cy="212" r="11" fill="var(--o)"/><text class="n" x="340" y="216">2</text>
<circle cx="340" cy="390" r="11" fill="var(--g)"/><text class="n" x="340" y="394">3</text>
</svg>
