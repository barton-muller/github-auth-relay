name = "github-auth-relay"
main = "index.js"
compatibility_date = "2025-01-01"

# Settings are not kept here, so a copy of this repo has nothing of mine in it.
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET and ALLOWED_ORIGINS are asked for by the Deploy to Cloudflare button
# (see .dev.vars.example) or set in the dashboard under Settings, Variables and Secrets.
# keep_vars stops a deploy from removing plain variables that were set in the dashboard.
keep_vars = true
